<!doctype html>
<html lang="fr-CH">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offres batismart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f6f8; --surface:#fff; --surface-2:#eef3f6; --ink:#14212b; --muted:#5d6b75; --line:#d8e1e7;
  --brand:#009bde; --brand-ink:#fff; --brand-soft:#e3f4fb; --green:#4cc38a; --green-soft:#e4f7ee;
  --warn:#b7791f; --warn-soft:#fdf3e1; --danger:#c0392b; --danger-soft:#fbe9e7; --radius:8px;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f161b; --surface:#162027; --surface-2:#1c2830; --ink:#e3ebf0; --muted:#97a6b0; --line:#2a3842;
    --brand:#2fb3ea; --brand-soft:#123445; --green-soft:#133528; --warn-soft:#3a2d12; --danger-soft:#3b1c18; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0f161b; --surface:#162027; --surface-2:#1c2830; --ink:#e3ebf0; --muted:#97a6b0; --line:#2a3842;
  --brand:#2fb3ea; --brand-soft:#123445; --green-soft:#133528; --warn-soft:#3a2d12; --danger-soft:#3b1c18; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand img{height:34px;border-radius:4px}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px}
.main{min-width:0;padding:22px 28px 60px}
.top{display:none}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.015em}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi span{display:block;color:var(--muted);font-size:12px}
.kpi strong{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13.5px;font-weight:400}
input[type=text],input[type=number],input[type=email],input[type=date],input[type=search],input[type=tel],select,textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;width:100%;min-width:0;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 40%,transparent);border-color:var(--brand)}
textarea{min-height:90px;resize:vertical;line-height:1.45}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:8px;white-space:nowrap;cursor:default}
.tbl th.sort{cursor:pointer}
.tbl th.sort:hover{color:var(--ink)}
.tbl td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
.tbl tr.click:hover td{background:var(--surface-2);cursor:pointer}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
.lines td{padding:4px}
.lines input,.lines select{padding:5px 6px;font-size:13px}
.lines .w-code{width:90px}.lines .w-q{width:70px}.lines .w-u{width:78px}.lines .w-p{width:92px}.lines .w-r{width:64px}.lines .w-t{width:64px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-Brouillon{background:var(--surface-2);color:var(--muted)}
.st-Envoyée{background:var(--brand-soft);color:var(--brand)}
.st-Enattente{background:var(--warn-soft);color:var(--warn)}
.st-Acceptée{background:var(--green-soft);color:#1f8a57}
.st-Refusée{background:var(--danger-soft);color:var(--danger)}
.st-Expirée{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.st-Annulée{background:var(--surface-2);color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.note{font-size:12px;color:var(--muted)}
.badge{font-size:11px;border-radius:4px;padding:1px 6px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.badge.ok{background:var(--green-soft);color:#1f8a57}
.badge.info{background:var(--brand-soft);color:var(--brand)}
.alert{border-radius:6px;padding:9px 12px;font-size:13px;background:var(--warn-soft);color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert.info{background:var(--brand-soft);color:var(--brand)}
.cands{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:6px;max-height:240px;overflow:auto}
.cands li button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.cands li:last-child button{border-bottom:0}
.cands li button:hover{background:var(--surface-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.block{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;background:var(--surface)}
.block>header{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius) var(--radius) 0 0;flex-wrap:wrap}
.block>header input{font-weight:600;background:var(--surface)}
.block .body{padding:8px 12px 12px}
.totals{display:grid;grid-template-columns:1fr auto;gap:2px 18px;max-width:360px;margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums}
.totals .t{text-align:right}
.totals .b{font-weight:700}
.sec{border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.sec>header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2);border-radius:6px 6px 0 0}
.sec>header b{flex:1}
.sec .prev{padding:10px 12px;font-size:13px;white-space:pre-wrap;color:var(--ink)}
.sec textarea{border:0;border-top:1px solid var(--line);border-radius:0 0 6px 6px;min-height:160px;font-family:var(--mono);font-size:12.5px}
.modal{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{width:min(640px,100%);max-height:90vh;overflow:auto}
.modal.wide .card{width:min(1000px,100%);height:90vh;display:flex;flex-direction:column}
.modal iframe{flex:1;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:6px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.hist{list-style:none;padding:0;margin:0;font-size:13px}
.hist li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:118px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.mono{font-family:var(--mono)}
.editbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin:-10px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.hint{background:var(--brand-soft);color:var(--ink);border-radius:6px;padding:10px 12px;font-size:12.5px}
.hint b{color:var(--brand)}
@media (max-width:1100px){ .split{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;z-index:40;transform:translateX(-102%);transition:transform .2s;height:100%}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .main{padding:16px 16px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .hide-m{display:none}
}
@media print{ .side,.top,.editbar{display:none} }

.stsel{width:auto;border-radius:999px;font-size:12.5px;font-weight:600;padding:4px 8px;border-color:transparent}
.btn svg{width:16px;height:16px;flex:none}
.head .row select{width:auto}
.lines{table-layout:fixed;min-width:740px}
.lines td{overflow:hidden}
.lines .n input{text-align:right}
.block>header input.grow{flex:1 1 260px;width:auto}
.block .row{flex-wrap:nowrap}
.block .row input.grow{min-width:0}
/* ---------- assistant */
.wiz{max-width:820px;margin:0 auto}
.wiz-top{display:flex;align-items:center;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex:1;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:13.5px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.steps li span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:12.5px}
.steps li.on{color:var(--ink);border-color:var(--brand)}
.steps li.on span{background:var(--brand);color:#fff}
.steps li.done span{background:var(--green);color:#fff}
.wiz-q{font-size:30px;letter-spacing:-.02em;margin:0 0 6px}
.wiz-help{color:var(--muted);font-size:15px;margin:0 0 20px}
.wiz-search{display:flex;gap:10px}
input.big{font-size:18px;padding:14px 16px;border-radius:10px}
.btn.lg{padding:12px 20px;font-size:15.5px;border-radius:10px}
.cands.big li button{padding:13px 14px;font-size:15px}
.wiz-card{margin-top:18px;padding:20px}
.wiz-addr{font-size:19px;font-weight:700;margin-bottom:14px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fact{display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.fact span{font-size:12px;color:var(--muted);font-weight:500}
.fact span em{font-style:normal;color:var(--warn);font-weight:600}
.fact b{font-size:15px}
.fact input,.fact select{font-size:15px;font-weight:600;padding:6px 8px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{display:flex;flex-direction:column;gap:4px;text-align:left;padding:18px 18px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer}
.choice b{font-size:17px}
.choice span{color:var(--muted);font-size:13.5px}
.choice:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(0,155,222,.12)}
.choice.on{border-color:var(--brand);background:var(--brand-soft)}
.wiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px;flex-wrap:wrap}
.wiz-price{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding:22px;border:2px solid var(--brand)}
.wiz-price span{display:block;color:var(--muted);font-size:13px}
.wiz-price strong{display:block;font-size:34px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wiz-price em{display:block;font-style:normal;color:#1f8a57;font-weight:600;font-size:13.5px;margin-top:4px}
.wiz-price ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--line);padding-left:20px}
.wiz-price li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:14px}
.wiz-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.wiz-actions .btn{flex:1;justify-content:center}
@media (max-width:860px){.facts,.choices{grid-template-columns:1fr}.wiz-price{grid-template-columns:1fr}.wiz-price ul{border:0;padding:0}.wiz-q{font-size:24px}.wiz-search{flex-direction:column}}
a.btn{text-decoration:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.seg button{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.seg button b{font-size:15px}.seg button span{font-size:12.5px;color:var(--muted)}
.seg button.on{border-color:var(--brand);background:var(--brand-soft)}
.choice:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;border-color:var(--line)}
.zones select,.zones input{font-size:13px}
.formsvd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fv{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;background:var(--surface)}
.fv.on{border-color:var(--brand);background:var(--brand-soft)}
.fv.lock{cursor:default;opacity:.85}
.fv input{margin-top:2px;flex:none}
.fv b{margin-right:4px}
.fv em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
@media (max-width:860px){.formsvd{grid-template-columns:1fr}}
.cx-crit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cx-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.cx-line summary{cursor:pointer}
details.wiz-card summary{cursor:pointer}
.cx-modal{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:14px;flex:1;min-height:0}
.cx-modal iframe{height:100%;min-height:420px}
.cx-modal #cxBody{overflow:auto}
.cx-modal .cx-crit{grid-template-columns:1fr}
@media (max-width:860px){.cx-crit,.cx-modal{grid-template-columns:1fr}.cx-modal iframe{min-height:300px}}
.v3d{position:relative;display:flex;flex-direction:column;min-height:420px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#cfe3ef}
.v3d-canvas{flex:1;min-height:380px;position:relative}
.v3d-canvas .cesium-viewer,.v3d-canvas .cesium-widget{position:absolute;inset:0}
.v3d-canvas .cesium-viewer-bottom{display:none}
.v3d-bar{position:absolute;top:8px;left:8px;display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.92);color:#14212b;padding:4px 6px;border-radius:8px;font-size:12px;z-index:2}
.v3d-bar .btn{background:#fff;color:#14212b}
.v3d-status{position:absolute;bottom:6px;left:8px;right:8px;background:rgba(255,255,255,.88);color:#14212b;padding:3px 8px;border-radius:6px;z-index:2}
.v3d-status:empty{display:none}
.v3d-ext{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.v3d-ext span{color:var(--muted);margin-right:4px}
.cx-view{display:flex;flex-direction:column;min-height:0}
.cx-view>.v3d{flex:1}
.ortho{position:relative;flex:1;min-height:420px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#9fb3a0}
.ortho-img{position:absolute;left:0;top:0;width:768px;height:768px}
.ortho-img img{position:absolute;width:256px;height:256px}
.ortho-pin{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#009bde;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.ortho .v3d-status{position:absolute;bottom:6px;left:8px;right:8px;background:rgba(255,255,255,.9);color:#14212b;padding:4px 8px;border-radius:6px}
.t3-host{position:relative;flex:1;min-height:420px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#dfe9ef;display:flex}
.t3-host>canvas{display:block;width:100%!important;height:100%!important}
.t3-host .ortho{border:0;border-radius:0;min-height:0}
.t3-status{margin-top:6px}
.t3-status.err{color:var(--danger)}
.t3-manual{margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.t3-manual[hidden]{display:none}
.t3-host.drop .ortho{filter:saturate(.6) brightness(1.05)}
.t3-host.over{outline:3px dashed var(--brand);outline-offset:-6px}
.t3-drop{position:absolute;inset:auto 16px 16px 16px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;background:rgba(255,255,255,.95);color:#14212b;border:2px dashed #009bde;border-radius:10px;padding:16px;z-index:3}
.t3-drop span{font-size:12.5px;color:#5d6b75}
.sat-host{position:relative;flex:1;min-height:420px;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;background:#9fb3a0}
.sat-host[hidden],.t3-host[hidden],.t3-views[hidden],.sat-ext[hidden],.t3-status[hidden]{display:none!important}
.sat-host iframe{flex:1;border:0;width:100%;min-height:420px}
.pseg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;margin-right:12px}
.pseg button{border:0;background:var(--surface);padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--muted)}
.pseg button.on{background:var(--brand);color:#fff}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js"></script>
</head>
<body>

const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open('batismart-offres', 2); } catch (e) { rej(e); return; }
      req.onupgradeneeded = () => { const d = req.result; ['offres', 'clients', 'articles', 'kv', 'tiles'].forEach((s) => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
      req.onsuccess = () => { this.db = req.result; res(); };
      req.onerror = () => rej(req.error);
    });
  },
  all(store) { return new Promise((res, rej) => { if (!this.db) return res([]); const r = this.db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  get(store, id) { return new Promise((res) => { if (!this.db) return res(null); try { const r = this.db.transaction(store).objectStore(store).get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); } }); },
  putRaw(store, obj) { return new Promise((res) => { if (!this.db) return res(); try { const t = this.db.transaction(store, 'readwrite'); t.objectStore(store).put(obj); t.oncomplete = () => res(); t.onerror = () => res(); } catch (e) { res(); } }); },
  put(store, obj) { return new Promise((res, rej) => { if (!this.db) return res(); const t = this.db.transaction(store, 'readwrite'); t.objectStore(store).put(clone(obj)); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  del(store, id) { return new Promise((res, rej) => { if (!this.db) return res(); const t = this.db.transaction(store, 'readwrite'); t.objectStore(store).delete(id); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  clear(store) { return new Promise((res) => { if (!this.db) return res(); const t = this.db.transaction(store, 'readwrite'); t.objectStore(store).clear(); t.oncomplete = () => res(); }); },
};

    const s = m[0]; if (s.startsWith('**')) out.push({ text: s.slice(2, -2), bold: true }); else out.push({ text: s.slice(1, -1), italics: true });
    last = m.index + s.length; }

function dxNode(n, ctx, out, o = {}) {

}

/* ---------- brouillon .eml (Outlook l'ouvre comme un nouveau message prêt à envoyer, PDF joint) */
const b64utf8 = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const encWord = (s) => (/^[\x20-\x7e]*$/.test(s) ? s : `=?UTF-8?B?${b64utf8(s)}?=`);

async function emlBlob(o, to, subject, body) {
  const pdf = new Uint8Array(await (await pdfBlob(o)).arrayBuffer()); let bin = '';
  for (let i = 0; i < pdf.length; i += 32768) bin += String.fromCharCode(...pdf.subarray(i, i + 32768));
  const bnd = 'batismart_' + uid(), name = pdfFileName(o);
  const eml = [`To: ${to}`, `Subject: ${encWord(subject)}`, 'X-Unsent: 1', 'MIME-Version: 1.0', `Content-Type: multipart/mixed; boundary="${bnd}"`, '',
    `--${bnd}`, 'Content-Type: text/plain; charset="utf-8"', 'Content-Transfer-Encoding: base64', '', wrap76(b64utf8(body.replace(/\r?\n/g, '\r\n'))),
    `--${bnd}`, `Content-Type: application/pdf; name="${name}"`, 'Content-Transfer-Encoding: base64', `Content-Disposition: attachment; filename="${name}"`, '', wrap76(btoa(bin)),
    `--${bnd}--`, ''].join('\r\n');
  return new Blob([eml], { type: 'message/rfc822' });
}

  const cx = (t.bb.x0 + t.bb.x1) / 2 - E0, cz = -((t.bb.y0 + t.bb.y1) / 2 - N0), cy = (t.bb.z1 - t.bb.z0) / 2;
  // flèche nord
  const ar = new THREE.Mesh(new THREE.ConeGeometry(R * 0.08, R * 0.25, 16), new THREE.MeshLambertMaterial({ color: 0x14212b })); ar.rotation.x = -Math.PI / 2; ar.position.set(cx, 0.1, cz - R * 1.25); sc.add(ar);
  ctl.target.set(cx, cy, cz);
  const setView = (side) => { const d = R * 2.4, el = R * 1.3; const off = { S: [0, el, d], N: [0, el, -d], E: [d, el, 0], O: [-d, el, 0], ISO: [d * 0.75, el * 1.2, d * 0.75] }[side] || [d * 0.75, el, d * 0.75];
    cam.position.set(cx + off[0], cy + off[1], cz + off[2]); ctl.update(); };
  setView('ISO');
  let run = true; const loop = () => { if (!run) return; ctl.update(); r.render(sc, cam); requestAnimationFrame(loop); }; loop();
  const ro = new ResizeObserver(() => { const W = host.clientWidth, Hh = host.clientHeight; if (W && Hh) { r.setSize(W, Hh); cam.aspect = W / Hh; cam.updateProjectionMatrix(); } }); ro.observe(host);
  T3.view = { setView, stop: () => { run = false; ro.disconnect(); r.dispose(); } };
}
function stop3d() { if (T3.view) { T3.view.stop(); T3.view = null; } }

/* ---------- orchestration depuis la fenêtre Complexité */
async function cachedTile(name) { const r = await DB.get('tiles', name); return r && r.blob ? new File([r.blob], name) : null; }
async function cacheTile(file) { try { await DB.putRaw('tiles', { id: file.name, blob: file, date: new Date().toISOString(), size: file.size }); } catch (e) { /* quota */ } }
function triggerBrowserDownload(href) { const f = document.createElement('iframe'); f.style.display = 'none'; f.src = href; document.body.appendChild(f); setTimeout(() => f.remove(), 120000); }
async function show3dFromFile(o, host, file, st) {
  const b = o.batiment;
  st('Lecture de la tuile (moteur 3D ~40 Mo, chargé une fois par session)…');
  const [ds] = await Promise.all([openTileFile(file), ensureThree()]);
  st('Extraction du bâtiment…');
  const layers = await extract3d(ds, +b.E, +b.N);
  const blds = buildings3d(layers); const t = pick3d(blds, +b.E, +b.N, b.egid);
  if (!t) throw new Error(`aucun bâtiment trouvé à l'adresse dans la tuile ${file.name} (mauvaise tuile ?)`);
  host.classList.remove('drop');
  render3d(host, t, blds, +b.E, +b.N);
  const m = metrics3d(t, blds);
  b.cx3d = { m, suggest: suggest3d(m), tile: file.name, egid: t.egid };
  await saveOffre(o); refreshCx();
  st(`Tuile ${file.name} · bâtiment EGID ${t.egid || '?'} · glisser : pivoter · molette : zoom · clic droit : déplacer`);
  document.querySelectorAll('#cx-modal [data-t3view]').forEach((x) => (x.disabled = false));
  const man = document.querySelector('#cx-modal .t3-manual'); if (man) man.hidden = true;
}
function armDrop(o, host, st, expected) {
  host.classList.add('drop');
  const label = document.createElement('div'); label.className = 't3-drop';
  label.innerHTML = `<b>Glissez ici le fichier téléchargé</b><span>${expected ? esc(expected) + ' – ' : ''}dans votre dossier Téléchargements</span><label class="btn sm pri">Choisir le fichier<input type="file" accept=".zip" hidden></label>`;
  host.appendChild(label);
  const go = async (f) => { if (!f) return; try { label.remove(); await show3dFromFile(o, host, f, st); await cacheTile(f); } catch (e) { st('3D : ' + e.message, true); host.appendChild(label); } };
  label.querySelector('input').onchange = (e) => go(e.target.files[0]);
  host.ondragover = (e) => { e.preventDefault(); host.classList.add('over'); };
  host.ondragleave = () => host.classList.remove('over');
  host.ondrop = (e) => { e.preventDefault(); host.classList.remove('over'); go(e.dataTransfer.files[0]); };
}
async function load3d(o, host, file) {
  const b = o.batiment, st = (m, err) => { const s = document.querySelector('#cx-modal .t3-status'); if (s) { s.textContent = m; s.classList.toggle('err', !!err); } };
  if (file) { try { await show3dFromFile(o, host, file, st); await cacheTile(file); } catch (e) { st('3D : ' + e.message, true); } return; }
  // 1. tuile déjà connue pour ce bâtiment ?
  let t = null;
  if (b.cx3d && b.cx3d.tile) { const f = await cachedTile(b.cx3d.tile); if (f) { try { await show3dFromFile(o, host, f, st); return; } catch (e) { await DB.del('tiles', b.cx3d.tile); } } }
  // 2. catalogue STAC
  st('Recherche de la tuile swissBUILDINGS3D…');
  try { t = await findTile(b); } catch (e) { st(`Catalogue swisstopo (STAC) inaccessible : ${e.message}.`, true); const man = document.querySelector('#cx-modal .t3-manual'); if (man) man.hidden = false; armDrop(o, host, st, null); return; }
  if (!t) { st('Aucune tuile swissBUILDINGS3D trouvée pour ces coordonnées.', true); const man = document.querySelector('#cx-modal .t3-manual'); if (man) man.hidden = false; armDrop(o, host, st, null); return; }
  // 3. cache navigateur
  const cached = await cachedTile(t.name);
  if (cached) { try { await show3dFromFile(o, host, cached, st); return; } catch (e) { await DB.del('tiles', t.name); } }
  // 4. téléchargement direct, sinon téléchargement par le navigateur + dépôt
  let f = null;
  try { f = await downloadTile(t.href, t.name, (g, tot) => st(`Téléchargement de la tuile ${t.name} : ${tot ? Math.round(100 * g / tot) + ' %' : fmtN(g / 1e6, 1) + ' Mo'}`)); }
  catch (e) {
    triggerBrowserDownload(t.href);
    st(`Le navigateur bloque la lecture directe (${e.message}) : la tuile ${t.name} est en cours de téléchargement dans votre dossier Téléchargements. Glissez-la dans la vue dès qu'elle est arrivée – elle sera ensuite mémorisée.`);
    armDrop(o, host, st, t.name); return;
  }
  try { await show3dFromFile(o, host, f, st); await cacheTile(f); } catch (e) { st('3D : ' + e.message, true); }
}

/* ------------------------------------------------------------ Swisstopo dans l'éditeur */
async function geoFind() {
  const q = $('#geoQ').value.trim(), st = $('#geoStatus'), ul = $('#geoCands'); if (!q) return;
  st.textContent = 'Recherche sur geo.admin.ch…'; ul.hidden = true;
  try {
    const res = await geoSearch(q, ($('#geoForm') && $('#geoForm').dataset.origins) || 'address');
    if (!res.length) { st.textContent = 'Adresse introuvable. Essayez « rue numéro, localité ».'; return; }
    st.textContent = `${res.length} résultat(s) – choisissez le bâtiment :`; ul.hidden = false;
    ul.innerHTML = res.map((c, i) => `<li><button type="button" data-cand="${i}">${esc(c.label)} ${c.egid ? `<span class="note mono">EGID ${c.egid}</span>` : ''}</button></li>`).join('');
    ul.onclick = (e) => { const b = e.target.closest('[data-cand]'); if (b) geoPick(res[+b.dataset.cand]); };
    if (res.length === 1) geoPick(res[0]);
  } catch (e) { st.textContent = `Recherche impossible (${e.message}). Vérifiez la connexion internet.`; }
}
async function geoPick(c) {
  const o = cur(), b = o.batiment, st = $('#geoStatus');
  const sp = splitAdresse(c.label);
  Object.assign(b, { adresse: c.label, E: c.E, N: c.N, lat: c.lat, lon: c.lon, egid: c.egid || '', rue: sp.rue, localitePost: sp.localite, npaPost: sp.npa });
  st.textContent = 'Lecture du RegBL et calcul du trajet…';
  if (b.neuf) { if (c.canton) b.canton = c.canton; b.egid = ''; }
  try { if (c.egid && !b.neuf) { const rb = await geoRegbl(c.egid); if (rb) Object.assign(b, rb, { adresse: c.label, rue: rb.rue || sp.rue, localitePost: rb.localitePost || sp.localite }); } } catch (e) { st.textContent = 'RegBL indisponible : ' + e.message; }
  try { await computeTrajets(b); } catch (e) { /* */ }
  if (!o.projet.adresse) o.projet.adresse = c.label;
  if (o.type === 'EN' && ['VD', 'FR', 'NE', 'VS'].includes(b.canton)) o.options.canton = b.canton;
  hist(o, 'Bâtiment', `${c.label}${b.egid ? ' · EGID ' + b.egid : ''}`);
  touch(o, true); await saveOffre(o); render(); toast('Données du bâtiment importées');
}

function modal(html, wide) { const m = document.createElement('div'); m.className = 'modal' + (wide ? ' wide' : ''); m.innerHTML = `<div class="card">${html}</div>`; m.onclick = (e) => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); }; document.body.appendChild(m); return m; }
function newOffreModal(clientId) {
  const m = modal(`<h2>Nouvelle offre</h2><div class="grid g2">${Object.entries(TYPES).map(([k, t]) => `<button class="btn" style="justify-content:flex-start;padding:12px" data-type="${k}"><b>${t.label}</b></button>`).join('')}</div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" data-close>Annuler</button></div>`);
  m.querySelectorAll('[data-type]').forEach((b) => b.onclick = async () => {
    const o = newOffre(b.dataset.type); if (clientId) { const c = S.clients.find((x) => x.id === clientId); if (c) applyClient(o, c); }
    await saveOffre(o); m.remove(); VIEW.tab = 'bat'; location.hash = '#/offre/' + o.id; });
}
async function duplicate(id) {
  const src = S.offres.find((o) => o.id === id), o = clone(src), d = today();
  Object.assign(o, { id: uid(), numero: nextNumero(new Date().toISOString()), statut: 'Brouillon', dateCreation: d, dateValidite: addDays(d, num(src.validiteJours)), envoi: null, historique: [], createdAt: new Date().toISOString() });
  o.blocks.forEach((b) => { const old = b.id; b.id = uid(); o.blocks.forEach((x) => { if (x.refs) x.refs = x.refs.map((r) => (r === old ? b.id : r)); }); b.lines && b.lines.forEach((l) => (l.id = uid())); });
  applyProjetAuto(o);
  hist(o, 'Création', `Dupliquée depuis l'offre n° ${src.numero}`);
  await saveOffre(o); toast(`Offre ${o.numero} créée`); VIEW.tab = 'client'; location.hash = '#/offre/' + o.id;
}
function previewModal(o) {
  if (!pdfReady()) return;
  const m = modal(`<div class="row" style="margin-bottom:10px"><h2 class="grow" style="margin:0">Aperçu – ${esc(pdfFileName(o))}</h2><button class="btn" data-dl>Télécharger</button><button class="btn ghost" data-close>Fermer</button></div><iframe title="Aperçu PDF"></iframe>`, true);
  pdfBlob(o).then((b) => { m.querySelector('iframe').src = URL.createObjectURL(b); });
  m.querySelector('[data-dl]').onclick = () => pdfDownload(o);
}
function sendModal(o) {
  const subj = mailSubject(o), body = mailBody(o);
  const m = modal(`<h2>Envoyer l'offre ${esc(o.numero)}</h2><div class="grid">
    <label class="f">Destinataire<input type="email" id="m-to" value="${esc(o.client.email)}"></label><label class="f">Objet<input type="text" id="m-subj" value="${esc(subj)}"></label>
    <label class="f">Message<textarea id="m-body" style="min-height:300px">${esc(body)}</textarea></label>
    <div class="note"><b>Brouillon Outlook</b> : télécharge un e-mail (.eml) avec le PDF « ${esc(pdfFileName(o))} » déjà joint – double-cliquez dessus, Outlook l'ouvre comme un nouveau message prêt à envoyer. La date d'envoi est enregistrée.</div></div>
    <div class="row" style="margin-top:14px;justify-content:flex-end;flex-wrap:wrap"><button class="btn ghost" data-close>Annuler</button><button class="btn ghost" id="m-mark">Marquer comme envoyée</button><button class="btn" id="m-go">Messagerie (sans pièce jointe)</button><button class="btn pri" id="m-eml">📧 Brouillon Outlook avec PDF joint</button></div>`);
  const mark = async () => { o.envoi = { date: new Date().toISOString(), to: $('#m-to').value, subject: $('#m-subj').value };
    if (['Brouillon', 'Expirée'].includes(o.statut)) { hist(o, 'Changement de statut', `${o.statut} → Envoyée`); o.statut = 'Envoyée'; }
    hist(o, 'Envoi', `à ${o.envoi.to} – « ${o.envoi.subject} »`); await saveOffre(o); m.remove(); render(); toast('Envoi enregistré'); };
  $('#m-mark').onclick = mark;
  $('#m-go').onclick = () => { if (!pdfReady()) return; pdfDownload(o); const href = `mailto:${encodeURIComponent($('#m-to').value)}?subject=${encodeURIComponent($('#m-subj').value)}&body=${encodeURIComponent($('#m-body').value)}`; setTimeout(() => { location.href = href; }, 600); mark(); };
  $('#m-eml').onclick = async () => { if (!pdfReady()) return;
    try { const blob = await emlBlob(o, $('#m-to').value, $('#m-subj').value, $('#m-body').value), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = pdfFileName(o).replace(/\.pdf$/, '.eml'); document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000); mark();
    } catch (e) { alert('Création de l\'e-mail impossible : ' + e.message); } };
}

/* ------------------------------------------------------------ événements */
function setPath(obj, path, val) { const k = path.split('.'); let o = obj; for (let i = 0; i < k.length - 1; i++) o = o[k[i]] ??= {}; o[k[k.length - 1]] = val; }
function readVal(el) { if (el.dataset.type === 'bool' || el.type === 'checkbox') return el.checked; if (el.dataset.type === 'numnull') return el.value === '' ? null : num(el.value); if (el.dataset.type === 'num' || el.type === 'number') return el.value === '' ? 0 : num(el.value); return el.value; }
const STRUCT = /^(batiment\.(categorie|logements|sre|surfaceSol|distanceKm|dureeMin|zoneManual|complexite)|options\.)/;
function onInput(e) {
  const el = e.target, o = (S.route === 'offre' || S.route === 'nouvelle') ? cur() : null;
  if (el.dataset.filter === 'q') { VIEW.filters.q = el.value; const pos = el.selectionStart; render(); const n = $('[data-filter="q"]'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (el.hasAttribute('data-wcq')) { VIEW.wcq = el.value; render(); const n = $('[data-wcq]'); n.focus(); n.setSelectionRange(el.value.length, el.value.length); return; }
  if (el.hasAttribute('data-cq')) { VIEW.cq = el.value; render(); const n = $('[data-cq]'); n.focus(); n.setSelectionRange(el.value.length, el.value.length); return; }
  if (el.hasAttribute('data-aq')) { VIEW.aq = el.value; render(); const n = $('[data-aq]'); n.focus(); n.setSelectionRange(el.value.length, el.value.length); return; }
  if (o && el.dataset.bind === 'batiment.adresse') { o.batiment.rue = ''; o.batiment.localitePost = ''; }
  if (o && el.dataset.bind && el.tagName !== 'SELECT' && el.type !== 'checkbox') { if (el.dataset.bind === 'projet.nom') o.projet.nomAuto = false; setPath(o, el.dataset.bind, readVal(el)); touch(o, false); refreshLive(o); const wn = $('[data-act="wizNext"]'); if (wn && S.route === 'nouvelle') { const k = wSteps(o)[VIEW.wstep || 0]; if (k === 'client') wn.disabled = !(o.client.societe || o.client.nom); if (k === 'bat') wn.disabled = !(o.batiment.adresse); } return; }
  if (o && el.dataset.line) { const [bid, lid, f] = el.dataset.line.split(':'); const b = o.blocks.find((x) => x.id === bid), l = b.lines.find((x) => x.id === lid);
    l[f] = ['qty', 'pu', 'rabais', 'tva'].includes(f) ? num(el.value) : el.value; if (f === 'pu' || f === 'qty') delete l.display; o.manual = true; touch(o, false); refreshLive(o); return; }
  if (o && el.dataset.blk) { const [bid, f] = el.dataset.blk.split(':'); const b = o.blocks.find((x) => x.id === bid); if (el.type !== 'checkbox' && el.tagName !== 'SELECT') { b[f] = el.value; if (f !== 'title' && f !== 'footnote') o.manual = true; touch(o, false); } return; }
  if (o && el.dataset.subv) { const [bid, i, f] = el.dataset.subv.split(':'); const s = o.blocks.find((x) => x.id === bid).subv[+i]; s[f] = f === 'label' ? el.value : num(el.value); o.manual = true; touch(o, false); refreshLive(o); return; }
  if (o && el.dataset.txt) { o.textOverrides[el.dataset.txt] = el.value; touch(o, false); return; }
  if (el.dataset.cf) { const c = S.clients.find((x) => x.id === S.param); c[el.dataset.cf] = el.value; saveClient(c); S.offres.filter((x) => x.clientId === c.id && x.statut === 'Brouillon').forEach((x) => { applyClient(x, c); saveOffre(x); }); return; }
  if (el.dataset.af) { const [id, k] = el.dataset.af.split(':'); const a = S.articles.find((x) => x.id === id); a[k] = ['prix', 'tva'].includes(k) ? num(el.value) : el.value; saveArticle(a); return; }
  if (el.dataset.dep) { const [i, k] = el.dataset.dep.split(':'); const d = S.settings.departs[+i]; d[k] = k === 'lat' || k === 'lon' ? (el.value === '' ? null : num(el.value)) : el.value; saveSettings(); return; }
  if (el.dataset.bar && el.type !== 'number') { setPath(S.baremes, el.dataset.bar, el.value); saveBaremes(); return; }
  if (el.dataset.set && el.tagName !== 'SELECT') { setPath(S.settings, el.dataset.set, readVal(el)); saveSettings(); return; }
}
async function onChange(e) {
  const el = e.target, o = (S.route === 'offre' || S.route === 'nouvelle') ? cur() : null;
  if (el.dataset.filter && el.dataset.filter !== 'q') { VIEW.filters[el.dataset.filter] = el.value; render(); return; }

async function onClick(e) {

    case 'preview': previewModal(o); break;

    case 'addLine': blkOf().lines.push({ id: uid(), code: '', label: '', qty: 1, unit: blkOf().mode === 'heures' ? 'h' : 'forfait', pu: blkOf().mode === 'heures' ? S.settings.taux : 0, rabais: 0, tva: S.settings.tva }); o.manual = true; touch(o, false); render(); break;

    case 'delZone': zonesOf(o).splice(+a.dataset.i, 1); touch(o, true); render(); break;
    case 'addBlock': o.blocks.push({ id: uid(), title: 'Devis', lines: [], rounding: 'floor1', mode: 'montants', subv: [], footnote: '' }); o.manual = true; touch(o, false); render(); break;
    case 'addSummary': o.blocks.push({ id: uid(), kind: 'summary', title: 'DEVIS TOTAL', refs: o.blocks.filter((b) => b.kind !== 'summary').map((b) => b.id), lines: [] }); o.manual = true; touch(o, false); render(); break;

    case 'delSubv': blkOf().subv.splice(+a.dataset.i, 1); o.manual = true; touch(o, false); render(); break;
    case 'editTxt': { const s = sectionsFor(o).find((x) => x.id === a.dataset.s); o.textOverrides[s.id] = s.body; touch(o, false); render(); break; }
    case 'resetTxt': delete o.textOverrides[a.dataset.s]; touch(o, false); render(); break;
